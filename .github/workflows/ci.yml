name: Test Solutions
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run solution testcases
        run: |
          for id in 1 2 9 21 206; do
            python3 local_run.py "$id" || exit 1
          done
